[project]
name = "capacity-tariff"
version = "0.1.0"
description = "Home Assistant integration that guards the Flemish capacity-tariff monthly peak (maandpiek)."
requires-python = ">=3.13"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
